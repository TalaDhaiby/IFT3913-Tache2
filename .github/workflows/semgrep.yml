
name: Semgrep Security Scan

on:
  push:
    branches: [tache3]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  semgrep:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Semgrep
        run: pip install semgrep==1.185.0

      - name: Find baseline
        run: |
          echo "BASELINE=$(git merge-base HEAD origin/main)" >> "$GITHUB_ENV"

      - name: Detect new vulnerabilities
        run: |
          semgrep scan \
            --config p/java \
            --baseline-commit "$BASELINE" \
            --error \
            --json \
            --output semgrep-new.json \
            tika-core

      - name: Save report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-new-findings
          path: semgrep-new.json

